# yaml-language-server: $schema=./node_modules/envio/evm.schema.json
name: pippo
description: Pippo cheques on Monad testnet and their Circle CCTP deliveries on nine other networks
rollback_on_reorg: true
address_format: lowercase

contracts:
  - name: ChequeBookFactory
    events:
      - event: "BookCreated(address indexed owner, address book)"
  - name: ChequeBook
    events:
      - event: "ChequeWritten(address indexed signer, uint256 amount, uint64 expiry, uint256 gasBudget)"
      - event: "ChequeCancelled(address indexed signer, uint256 released)"
      - event: "Paid(address indexed signer, address indexed recipient, uint256 amount)"
      - event: "PaidCrossChain(address indexed signer, uint32 indexed domain, bytes32 recipient, uint256 amount, uint256 maxFee)"
  # Circle CCTP MessageTransmitterV2, at the same address on every testnet. Its MessageReceived carries the burn
  # message, which names the paying cheque book as messageSender.
  - name: MessageTransmitter
    events:
      - event: "MessageReceived(address indexed caller, uint32 sourceDomain, bytes32 indexed nonce, bytes32 sender, uint32 indexed finalityThresholdExecuted, bytes messageBody)"

# Start blocks match the factory deployment (2026-10-11 08:40 UTC) on every chain.
chains:
  - id: 10143 # Monad testnet
    start_block: 70066024
    contracts:
      - name: ChequeBookFactory
        address: "0xe51e48f765440c9c4187a11c78b17a810232d4f8"
      - name: ChequeBook
  - id: 84532 # Base Sepolia
    start_block: 47969859
    contracts:
      - name: MessageTransmitter
        address: "0xe737e5cebeeba77efe34d4aa090756590b1ce275"
  - id: 421614 # Arbitrum Sepolia
    start_block: 318020053
    contracts:
      - name: MessageTransmitter
        address: "0xe737e5cebeeba77efe34d4aa090756590b1ce275"
  - id: 11155420 # OP Sepolia
    start_block: 49952733
    contracts:
      - name: MessageTransmitter
        address: "0xe737e5cebeeba77efe34d4aa090756590b1ce275"
  - id: 80002 # Polygon Amoy
    start_block: 49885503
    contracts:
      - name: MessageTransmitter
        address: "0xe737e5cebeeba77efe34d4aa090756590b1ce275"
  - id: 43113 # Avalanche Fuji
    start_block: 59299065
    contracts:
      - name: MessageTransmitter
        address: "0xe737e5cebeeba77efe34d4aa090756590b1ce275"
  - id: 11155111 # Ethereum Sepolia
    start_block: 11890577
    contracts:
      - name: MessageTransmitter
        address: "0xe737e5cebeeba77efe34d4aa090756590b1ce275"
  # HyperSync doesn't cover these testnets yet, so they sync over RPC.
  - id: 1301 # Unichain Sepolia
    start_block: 64855577
    rpc:
      url: ${ENVIO_UNICHAIN_SEPOLIA_RPC_URL:-https://sepolia.unichain.org}
      for: sync
    contracts:
      - name: MessageTransmitter
        address: "0xe737e5cebeeba77efe34d4aa090756590b1ce275"
  - id: 59141 # Linea Sepolia
    start_block: 32832436
    rpc:
      url: ${ENVIO_LINEA_SEPOLIA_RPC_URL:-https://rpc.sepolia.linea.build}
      for: sync
    contracts:
      - name: MessageTransmitter
        address: "0xe737e5cebeeba77efe34d4aa090756590b1ce275"
  - id: 4801 # World Chain Sepolia
    start_block: 35580291
    rpc:
      url: ${ENVIO_WORLDCHAIN_SEPOLIA_RPC_URL:-https://worldchain-sepolia.g.alchemy.com/public}
      for: sync
    contracts:
      - name: MessageTransmitter
        address: "0xe737e5cebeeba77efe34d4aa090756590b1ce275"
