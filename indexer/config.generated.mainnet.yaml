name: spookly-mainnet
description: Spookly mainnet spooks and CCTP deliveries
rollback_on_reorg: true
address_format: lowercase

contracts:
  - name: SpookBookFactory
    events:
      - event: "BookCreated(address indexed owner, address book)"
  - name: SpookBook
    events:
      - event: "SpookCreated(address indexed signer, uint256 amount, uint64 expiry, uint256 gasBudget)"
      - event: "SpookCancelled(address indexed signer, uint256 released)"
      - event: "Paid(address indexed signer, address indexed recipient, uint256 amount)"
      - event: "PaidCrossChain(address indexed signer, uint32 indexed domain, bytes32 recipient, uint256 amount, uint256 maxFee)"
  # Circle CCTP MessageTransmitterV2, at the same address on every testnet. Its MessageReceived carries the burn
  # message, which names the paying spook book as messageSender.
  - name: MessageTransmitter
    events:
      - event: "MessageReceived(address indexed caller, uint32 sourceDomain, bytes32 indexed nonce, bytes32 sender, uint32 indexed finalityThresholdExecuted, bytes messageBody)"

# Source indexing starts at the configured factory deployment.
