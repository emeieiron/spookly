name: pippo-mainnet
services:
  postgres:
    image: postgres:18.3
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${ENVIO_PG_PASSWORD:?Set the mainnet database password}
      POSTGRES_DB: envio-dev
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - mainnet-postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d envio-dev"]
      interval: 2s
      timeout: 3s
      retries: 20
  hasura:
    image: hasura/graphql-engine:v2.43.0
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:8081:8080"
    environment:
      HASURA_GRAPHQL_DATABASE_URL: postgres://postgres:${ENVIO_PG_PASSWORD}@postgres:5432/envio-dev
      HASURA_GRAPHQL_ADMIN_SECRET: ${HASURA_GRAPHQL_ADMIN_SECRET:?Set the mainnet Hasura secret}
      HASURA_GRAPHQL_UNAUTHORIZED_ROLE: public
      HASURA_GRAPHQL_ENABLE_CONSOLE: "true"
      HASURA_GRAPHQL_ENABLE_TELEMETRY: "false"
volumes:
  mainnet-postgres:
