[profile.default]
src = "src"
out = "out"
test = "test"
libs = ["../node_modules"]
remappings = [
  "@openzeppelin/contracts/=../node_modules/@openzeppelin/contracts/",
  "@account-abstraction/contracts/=../node_modules/@account-abstraction/contracts/",
]
solc_version = "0.8.30"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
